<!doctype html>
<html lang="en" data-title-key="topic_school">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- i18n.js turns this into "<topic> · Practice English"; conversation.js updates it for other topics. -->
<title data-i18n="topic_school">Talking About School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="convo" id="convo">
  <aside class="transcript-panel" id="transcript-panel">
    <h2 class="side-label" id="transcript-title" data-i18n="transcript">Transcript</h2>
    <ol class="lines" id="lines" aria-live="polite" aria-labelledby="transcript-title"></ol>
    <div class="transcript-tools" id="transcript-tools">
      <div class="tr-pick" id="tr-pick" hidden>
        <label for="tr-lang" data-i18n="translate_to">Translate to</label>
        <select id="tr-lang" class="side-input"></select>
      </div>
      <div class="tool-row">
        <button class="pill tool" id="translate-btn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h8M8 3v2M10 5c-1 4-3.5 7-6 8.5M6 9c1.2 2 3 3.6 5 4.5M13 21l4-9 4 9M14.5 18h5"/></svg>
          <span data-i18n="translate">Translate</span>
        </button>
        <button class="pill tool" id="hide-btn" type="button" aria-controls="transcript-panel" aria-expanded="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span id="hide-label">Hide</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="convo-main">
    <div class="convo-top" id="convo-top">
      <a class="pill back" href="practice.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-i18n="go_back">Go Back</span>
      </a>
    </div>

    <h1 class="convo-title"><span class="en" lang="en" id="topic-name">Talking About School</span><span class="tr" id="topic-hint" data-i18n-hint="topic_school"></span></h1>

    <div class="stage-wrap">
      <!-- The illustrated teacher (avatar.js) is added inside #stage. In video mode the realistic
           teacher (Simli) plays in the <video>, and her voice plays through the <audio>. -->
      <div class="stage" id="stage">
        <video class="teacher-video" id="teacher-video" playsinline autoplay muted hidden></video>
      </div>
      <audio id="teacher-audio" autoplay hidden></audio>
      <p class="demo-note" id="demo-note" data-i18n="demo_mode" hidden>Demo mode — not connected to AI yet</p>
      <span class="ai-chip" data-i18n="ai_teacher">AI teacher</span>
      <button class="stage-start" id="stage-start" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
        <span id="stage-start-label">Start conversation</span>
      </button>
      <button class="hear-first" id="hear-first" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span data-i18n="tap_to_hear">Tap to hear the teacher</span>
      </button>
    </div>

    <div class="controls">
      <button class="mic" id="mic" type="button" aria-label="Tap to talk" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
      </button>
      <p class="mic-status" id="mic-status" role="status">Tap to talk</p>
      <button class="small-btn" id="start-over" type="button" data-i18n="start_over" hidden>Start over</button>
      <form class="type-form" id="type-form" novalidate>
        <input id="type-input" class="side-input" type="text" lang="en" dir="auto" maxlength="600" autocomplete="off" data-i18n-placeholder="type_answer" placeholder="Or type your answer here" aria-label="Or type your answer here">
        <button class="small-btn" id="send-btn" type="submit" data-i18n="send">Send</button>
      </form>
    </div>
  </main>
</div>
<script src="i18n.js"></script>
<script src="avatar.js"></script>
<script src="vendor/simli-client-3.2.0.js"></script>
<script src="conversation.js"></script>
</body>
</html>
